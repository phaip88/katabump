name: Katabump Auto Renew

on:
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:

permissions:
  contents: read # 最小权限：任务只读代码，不需要写仓库

# 定时任务在 job 内随机延迟最长 10 分钟，期间手动触发仍可能并发，
# 两个实例同时操作同一批账号有风控风险，这里强制串行并取消旧任务
concurrency:
  group: katabump-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: windows-latest
    timeout-minutes: 120 # 覆盖最大随机延迟 10min + 多账号执行时间，防止 Chrome 挂起空烧

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: powershell

      - name: Start Proxy and Run Renew Script
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_TEST_URLS: ${{ vars.PROXY_TEST_URLS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
        run: |
          if ($env:PROXY_URL) {
            $SINGBOX_VER="1.11.0"
            $ARCHIVE="sing-box-${SINGBOX_VER}-windows-amd64.zip"
            echo "Downloading sing-box v${SINGBOX_VER} for windows..."
            Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/${ARCHIVE}" -OutFile $ARCHIVE
            Expand-Archive -Path $ARCHIVE -DestinationPath .
            Move-Item -Path "sing-box-${SINGBOX_VER}-windows-amd64\sing-box.exe" -Destination .\sing-box.exe

            echo "Generating sing-box config from PROXY_URL..."
            python proxy_handler.py

            echo "Starting sing-box..."
            Start-Process -FilePath .\sing-box.exe -ArgumentList "run -c config.json" -NoNewWindow -RedirectStandardOutput singbox_out.log -RedirectStandardError singbox_err.log -PassThru | Set-Variable -Name "proc"
            Start-Sleep -Seconds 3

            if ($proc.HasExited) {
              echo "sing-box exited unexpectedly."
              if (Test-Path singbox_out.log) { Get-Content singbox_out.log }
              if (Test-Path singbox_err.log) { Get-Content singbox_err.log }
              exit 1
            }

            echo "Testing proxy connection..."
            python -c "import urllib.request; req = urllib.request.build_opener(urllib.request.ProxyHandler({'http': 'http://127.0.0.1:8080', 'https': 'http://127.0.0.1:8080'})); print(req.open('http://ip-api.com/json', timeout=10).read().decode('utf-8'))" > ip.txt
            $IP = Get-Content ip.txt -ErrorAction SilentlyContinue
            if (-not $IP) { $IP = "FAILED" }
            echo "Proxy Exit IP: $IP"
            if ($IP -eq "FAILED") {
              echo "Proxy failed to route traffic!"
              if (Test-Path singbox_err.log) { Get-Content singbox_err.log }
              exit 1
            }
          }

          echo "Running Python script..."
          python action_renew.py
          $exitCode = $LASTEXITCODE

          if ($env:PROXY_URL) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          exit $exitCode
        shell: powershell

      - name: Show Proxy Diagnostics
        if: always()
        run: |
          if (Test-Path singbox_err.log) {
            Get-Content singbox_err.log
          }
        shell: powershell

      - name: Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katabump-diagnostics-${{ github.run_id }}
          path: |
            screenshots/
            singbox_out.log
            singbox_err.log
          if-no-files-found: warn
          retention-days: 7
